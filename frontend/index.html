<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05080f" />
    <meta
      name="description"
      content="TruthShield — website trust intelligence. Detect phishing pages, malicious URLs, domain impersonation, certificate anomalies and web security weaknesses."
    />
    <title>TruthShield — Website Trust & Threat Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the stored theme before first paint to avoid a flash.
      (function () {
        try {
          var stored = localStorage.getItem('truthshield:theme');
          var theme = stored ? JSON.parse(stored) : 'dark';
          if (theme !== 'light') document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = theme === 'light' ? 'light' : 'dark';
        } catch (error) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
